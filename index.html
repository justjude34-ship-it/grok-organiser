<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#3d6b4f">
  <title>Kitchen Organiser</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; max-width: 100%; overflow-x: hidden; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #f4efe6;
      color: #2c241b;
      line-height: 1.5;
      padding: 20px 16px 48px;
    }
    main { width: 100%; max-width: 640px; margin: 0 auto; }
    .eyebrow { color: #3d6b4f; font-size: 0.95rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; margin: 0 0 6px; }
    h1 { font-size: 1.85rem; margin: 0 0 10px; line-height: 1.2; }
    .hint { color: #5b5146; font-size: 1.08rem; margin: 0 0 16px; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 14px; }
    .chip {
      border: 1px solid #c9bba8; background: #fff; color: #3a3229;
      border-radius: 999px; padding: 10px 14px; font-size: 1rem; cursor: pointer;
    }
    .chip.active { background: #3d6b4f; color: #fff; border-color: #3d6b4f; }
    textarea {
      width: 100%; min-height: 130px; padding: 14px; font-size: 1.08rem;
      border: 1px solid #c9bba8; border-radius: 14px; background: #fff; color: #2c241b;
    }
    button.primary {
      display: block; width: 100%; margin-top: 12px; padding: 16px;
      font-size: 1.15rem; font-weight: 700; border: 0; border-radius: 14px;
      background: #3d6b4f; color: #fff;
    }
    .card { background: #fff; border-radius: 14px; padding: 16px; margin: 12px 0 0; }
    .card strong { display: block; margin-bottom: 6px; color: #3d6b4f; font-size: 1.08rem; }
    .card p { margin: 0 0 8px; }
    .card p:last-child { margin: 0; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Professional organiser</p>
    <h1>Kitchen Organiser</h1>
    <p class="hint">Tell me what is hard. I will give the next useful step, not a lecture.</p>
    <div class="chips">
      <button type="button" class="chip" data-text="small kitchen, no pantry">small, no pantry</button>
      <button type="button" class="chip" data-text="cluttered bench">cluttered bench</button>
      <button type="button" class="chip" data-text="deep cabinets I cannot reach the back of">deep cabinets</button>
      <button type="button" class="chip" data-text="too much stuff, no zones">too much stuff</button>
    </div>
    <textarea id="problem" placeholder="Example: small kitchen, no pantry, cluttered bench"></textarea>
    <button type="button" class="primary" onclick="getAdvice()">Get advice</button>
    <div id="advice"></div>
  </main>
  <script>
    document.querySelectorAll(".chip").forEach(function (chip) {
      chip.addEventListener("click", function () {
        var box = document.getElementById("problem");
        var extra = chip.getAttribute("data-text");
        box.value = box.value ? box.value + ", " + extra : extra;
        chip.classList.add("active");
        box.focus();
      });
    });
    function card(title, body) {
      return "<div class=\"card\"><strong>" + title + "</strong>" + body + "</div>";
    }
    function getAdvice() {
      var text = (document.getElementById("problem").value || "").toLowerCase();
      var html = "";
      if (text.includes("small") || text.includes("tiny") || text.includes("no space")) {
        html += card("Start with height, not more stuff", "<p>In a small kitchen, the floor is already full. Use the wall and the unused space above the fridge or bench first.</p><p>Put everyday items at eye level. Park rarely used things up high.</p>");
      }
      if (text.includes("pantry") || text.includes("no pantry")) {
        html += card("No pantry? Make a pull-out one", "<p>A narrow pull-out rack, baskets, or a lazy susan in a corner cabinet beats stacking tins at the back.</p><p>Keep breakfast in one basket, baking in another, so you are not hunting.</p>");
      }
      if (text.includes("clutter") || text.includes("cluttered") || text.includes("bench") || text.includes("counter")) {
        html += card("Clear the bench first", "<p>A bench is a landing strip, not storage. Keep only the kettle and one daily tool out.</p><p>Use one-in-one-out: something new comes in, something unused goes out.</p>");
      }
      if (text.includes("cabinet") || text.includes("deep") || text.includes("reach") || text.includes("storage")) {
        html += card("Stop losing things at the back", "<p>Deep cabinets fail because the back becomes a graveyard. Add a pull-out tray or turntable.</p><p>Everyday items at the front. Bulk and spare at the back or up high.</p>");
      }
      if (text.includes("zone") || text.includes("stuff") || text.includes("too much")) {
        html += card("Give the kitchen four jobs", "<p>Work, storage, landing, and maintenance. Like stays with like: mugs with mugs, food with food.</p><p>If it has no home, it will live on the bench again tomorrow.</p>");
      }
      if (!html) {
        html = card("Need one more detail", "<p>Say if it is small, missing a pantry, cluttered, or hard to reach. I will match that to the next step.</p>");
      }
      document.getElementById("advice").innerHTML = html;
    }
  </script>
</body>
</html>
